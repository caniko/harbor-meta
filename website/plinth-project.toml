[site]
title = "Harbor"
description = "Shared Nix flake libraries for Rust, Python, JavaScript, Android, TeX, databases, and editor tooling."
base_url = "/"
footer_note = "Harbor keeps language-specific Nix plumbing in dedicated flakes so projects stay thin."

[theme]
paper = "#0F172A"
surface = "#111827"
ink = "#F8FAFC"
ink_soft = "#CBD5E1"
line = "rgba(148, 163, 184, 0.22)"
accent = "#38BDF8"
accent_soft = "#082F49"
secondary = "#F59E0B"
warning = "#FB7185"
rust = "#22C55E"

