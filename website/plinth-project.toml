[[pages]]
slug = "index"
title = "Harbor"
description = "Shared Nix flake libraries for Rust, Python, JavaScript, Android, TeX, databases, and editor tooling."

[[pages.sections]]
type = "hero"
logo_src = "/harbor-mark.svg"
title = "Harbor"
tagline = "Language flakes for Nix, without copying the plumbing."
subtitle = "Each harbor owns one language surface. Projects keep policy local and import the helpers they need."

[[pages.sections.ctas]]
label = "Browse flakes"
href = "#ecosystem"
primary = true

[[pages.sections.ctas]]
label = "harbor-rs docs"
href = "https://harbor-rs.tartanoglu.com/docs/"

[[pages.sections]]
type = "project_grid"
id = "ecosystem"
heading = "Harbor flakes"
intro = "Seven libraries. Pick the language you are packaging."

[[pages.sections]]
type = "workflow_steps"
id = "use"
heading = "How to consume one"
intro = "Every harbor is a flake input. Policy stays in the project."

[[pages.sections.steps]]
title = "Add the input"
description = "Pin the language flake you need, for example `github:caniko/harbor-rs`."

[[pages.sections.steps]]
title = "Call the helper"
description = "Use `harbor-*.lib.mk…` for toolchains, shells, packages, or systemd units."

[[pages.sections.steps]]
title = "Keep project policy local"
description = "Versions, profiles, and release rules stay in the consuming flake."

[[pages]]
slug = "rs"
title = "harbor-rs"
description = "Reusable Rust toolchain and cross-compilation infrastructure for Nix flakes."

[[pages.sections]]
type = "hero"
logo_src = "/harbor-mark.svg"
title = "harbor-rs"
tagline = "Reusable Rust toolchain and cross-compilation infrastructure for Nix flakes."
subtitle = "Toolchains, cross targets, generated Cargo config, and packaging helpers live here instead of in every Rust workspace."

[[pages.sections.ctas]]
label = "Full reference"
href = "https://harbor-rs.tartanoglu.com/docs/"
primary = true

[[pages.sections.ctas]]
label = "Source"
href = "https://github.com/caniko/harbor-rs"

[[pages.sections]]
type = "feature_grid"
id = "surface"

[[pages.sections.features]]
title = "mkToolchain"
description = "Nightly or stable Rust toolchains with crane already wired in. Optional fleet profiles pin versions centrally."
highlight = true

[[pages.sections.features]]
title = "mkCross / mkCrossPackages"
description = "Native, MinGW, aarch64-linux, and optional osxcross environments from one library."

[[pages.sections.features]]
title = "mkCargoConfig"
description = "Emit linker and compiler settings once, then serve them from a cache-keyed CARGO_HOME."

[[pages.sections.features]]
title = "Packaging"
description = "AppImage, Flatpak, Homebrew, deb, Scoop, Chocolatey, Dioxus web/fullstack, and signed GitHub archives."

[[pages.sections]]
type = "install"
id = "install"
heading = "Add it"
intro = "The full API, templates, and packaging notes live in the dedicated harbor-rs docs."
guide_href = "https://harbor-rs.tartanoglu.com/docs/"

[[pages.sections.primary_routes]]
label = "Flake input"
audience = "Nix"
command = "inputs.harbor-rs.url = \"github:caniko/harbor-rs\";"
href = "https://harbor-rs.tartanoglu.com/docs/#quick-start"
recommended = true

[[pages]]
slug = "py"
title = "harbor-py"
description = "Reusable Python uv2nix and pyproject-nix infrastructure for Nix flakes."

[[pages.sections]]
type = "hero"
logo_src = "/harbor-mark.svg"
title = "harbor-py"
tagline = "Reusable Python uv2nix and pyproject-nix infrastructure for Nix flakes."
subtitle = "Downstream flakes keep project policy local while sharing the boring Python/Nix plumbing."

[[pages.sections.ctas]]
label = "Source"
href = "https://github.com/caniko/harbor-py"
primary = true

[[pages.sections]]
type = "feature_grid"
id = "surface"

[[pages.sections.features]]
title = "uv environments"
description = "`mkUvVirtualEnv` and `mkUvCheckEnv` return immutable uv2nix environments. Use `${env}/bin/python`."
highlight = true

[[pages.sections.features]]
title = "Dev shells"
description = "`mkUvDevShell` extraPackages are Nix tools only. Python deps stay in pyproject.toml and uv.lock."

[[pages.sections.features]]
title = "Overrides"
description = "Setuptools, Torch runtime, and TorchCodec FFmpeg helpers live under `pythonOverrides`."

[[pages.sections.features]]
title = "Template"
description = "`nix flake init -t github:caniko/harbor-py` scaffolds a consumer."

[[pages.sections]]
type = "install"
id = "install"
heading = "Add it"
intro = "Pin harbor-py and call `harbor-py.lib` from your flake."
guide_href = "https://github.com/caniko/harbor-py"

[[pages.sections.primary_routes]]
label = "Template"
audience = "Nix"
command = "nix flake init -t github:caniko/harbor-py"
href = "https://github.com/caniko/harbor-py#minimal-usage"
recommended = true

[[pages]]
slug = "js"
title = "harbor-js"
description = "Reusable JavaScript and Bun infrastructure for Nix flakes."

[[pages.sections]]
type = "hero"
logo_src = "/harbor-mark.svg"
title = "harbor-js"
tagline = "Reusable JavaScript and Bun infrastructure for Nix flakes."
subtitle = "The first maintained surface wraps bun-overlay. Node, pnpm, Yarn, and generic JS helpers can join later under `lib.bun` without a rename."

[[pages.sections.ctas]]
label = "Source"
href = "https://github.com/caniko/harbor-js"
primary = true

[[pages.sections]]
type = "feature_grid"
id = "surface"

[[pages.sections.features]]
title = "mkBunPackage"
description = "Keeps the upstream Bun binary unpatched on Linux and runs it through proot so `bun build --compile` works in Nix sandboxes."
highlight = true

[[pages.sections.features]]
title = "Toolchain"
description = "`mkBunToolchain`, `mkBunDevShell`, `mkBunWorkspaceDeps`, and `readPackageManagerVersion`."

[[pages.sections.features]]
title = "FHS runner"
description = "`bun.passthru.fhsRunner` runs Bun-compiled Linux executables in checks or install hooks."

[[pages.sections.features]]
title = "Pinned Bun"
description = "`packages.<system>.bun_1_3_14` plus an x86_64-linux baseline build."

[[pages.sections]]
type = "install"
id = "install"
heading = "Add it"
intro = "Start from the template or import `lib.bun` directly."
guide_href = "https://github.com/caniko/harbor-js"

[[pages.sections.primary_routes]]
label = "Template"
audience = "Nix"
command = "nix flake init -t github:caniko/harbor-js"
href = "https://github.com/caniko/harbor-js#harbor-js"
recommended = true

[[pages]]
slug = "db"
title = "harbor-db"
description = "Secure generic lifecycle-operation plans and NixOS systemd wiring."

[[pages.sections]]
type = "hero"
logo_src = "/harbor-mark.svg"
title = "harbor-db"
tagline = "Lifecycle operations without owning your database."
subtitle = "Projects keep idempotent ensure/check commands. harbor-db owns ordering, confirmation, readiness, credentials, state directories, and the deployment envelope."

[[pages.sections.ctas]]
label = "Source"
href = "https://github.com/caniko/harbor-db"
primary = true

[[pages.sections]]
type = "feature_grid"
id = "surface"

[[pages.sections.features]]
title = "Project surface"
description = "`services.harbor-db.projects.<name>` generates migrate and check units, then orders runtime services after them."
highlight = true

[[pages.sections.features]]
title = "Framework-agnostic"
description = "No baked-in migration framework, database, or application. Schema, backfills, backups, grants, and cutovers all fit."

[[pages.sections.features]]
title = "Postgres helpers"
description = "Optional database URL, setup units, and runtime-role grants for Postgres-backed services."

[[pages.sections.features]]
title = "Pink Raven shape"
description = "Keep SQLx behind `raven db migrate` and let harbor-db own users, grants, and unit order."

[[pages.sections]]
type = "install"
id = "install"
heading = "Add it"
intro = "Import the NixOS module and declare a project runner."
guide_href = "https://github.com/caniko/harbor-db"

[[pages.sections.primary_routes]]
label = "NixOS module"
audience = "NixOS"
command = "imports = [inputs.harbor-db.nixosModules.default];"
href = "https://github.com/caniko/harbor-db#project-surface"
recommended = true

