[[pages]]
slug = "meta"
title = "harbor-meta"
description = "Shared harbor helpers for editor and agent tooling."

[[pages.sections]]
type = "hero"
logo_src = "/harbor-mark.svg"
title = "harbor-meta"
tagline = "Shared harbor helpers for editor and agent tooling."
subtitle = "Cross-language policy used by the language harbors: dev-shell fragments, template tests, and Opencode LSP discovery."

[[pages.sections.ctas]]
label = "Source"
href = "https://github.com/caniko/harbor-meta"
primary = true

[[pages.sections]]
type = "feature_grid"
id = "surface"

[[pages.sections.features]]
title = "Dev-shell fragments"
description = "Language harbors merge `{ packages, env, shellHook }` and render with `lib.devShell.mkShell`."
highlight = true

[[pages.sections.features]]
title = "Template tests"
description = "`lib.devShellTests` and `lib.templateTests` import consumer `flake.nix` files with current inputs. No nested nix."

[[pages.sections.features]]
title = "Opencode LSP"
description = "Checked-in `.opencode/opencode.jsonc` declares LSPs. The direnv harbor shell supplies the binaries."

[[pages.sections.features]]
title = "harbor-opencode"
description = "`sync`, `check`, and `rollout` keep editor config aligned across trees."

[[pages.sections]]
type = "install"
id = "install"
heading = "Operator CLI"
intro = "The package is this flake's default output."
guide_href = "https://github.com/caniko/harbor-meta"

[[pages.sections.primary_routes]]
label = "Sync"
audience = "Operators"
command = "harbor-opencode sync --kind detect"
href = "https://github.com/caniko/harbor-meta#usage"
recommended = true

